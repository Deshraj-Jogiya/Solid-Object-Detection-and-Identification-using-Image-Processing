name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the real unit tests (dataset generation, traditional CV pipeline, CNN model)
        run: python -m unittest discover -s tests -v

  aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r aws/requirements.txt
      - name: Run the real ONNX-exported model inference tests (no AWS needed)
        run: python -m unittest aws.test_lambda_function -v
      - name: Run the real live S3 -> Lambda integration test (real deployed AWS infra, no mocks)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python -m unittest aws.test_s3_integration -v
